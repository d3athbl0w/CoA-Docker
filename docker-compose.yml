services:
  ac-database:
    container_name: ac-database
    image: mysql:8.4
    networks:
      - ac-network
    ports:
      - "${DOCKER_DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-password}
    volumes:
      - ${DOCKER_VOL_DB:-ac-database-data}:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  ac-db-import:
    container_name: ac-db-import
    image: coa/ac-db-import:${DOCKER_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      target: db-import
      args:
        USER_ID: ${DOCKER_USER_ID:-1000}
        GROUP_ID: ${DOCKER_GROUP_ID:-1000}
        DOCKER_USER: ${DOCKER_USER:-acore}
        SOURCE_PATH: source
    networks:
      - ac-network
    environment:
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};${AC_AUTH_DATABASE:-acore_auth}"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};${AC_WORLD_DATABASE:-acore_world}"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};${AC_CHARACTERS_DATABASE:-acore_characters}"
    volumes:
      - ${DOCKER_VOL_ETC:-./config}:/azerothcore/env/dist/etc
      - ${DOCKER_VOL_LOGS:-ac-server-logs}:/azerothcore/env/dist/logs
    depends_on:
      ac-database:
        condition: service_healthy

  ac-authserver:
    container_name: ac-authserver
    image: coa/ac-authserver:${DOCKER_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      target: authserver
      args:
        USER_ID: ${DOCKER_USER_ID:-1000}
        GROUP_ID: ${DOCKER_GROUP_ID:-1000}
        DOCKER_USER: ${DOCKER_USER:-acore}
        SOURCE_PATH: source
    networks:
      - ac-network
    ports:
      - "${DOCKER_AUTH_EXTERNAL_PORT:-3724}:3724"
    environment:
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_TEMP_DIR: "/azerothcore/env/dist/temp"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};${AC_AUTH_DATABASE:-acore_auth}"
    volumes:
      - ${DOCKER_VOL_ETC:-./config}:/azerothcore/env/dist/etc
      - ${DOCKER_VOL_LOGS:-ac-server-logs}:/azerothcore/env/dist/logs
    restart: unless-stopped
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully

  ac-worldserver:
    container_name: ac-worldserver
    image: coa/ac-worldserver:${DOCKER_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      target: worldserver
      args:
        USER_ID: ${DOCKER_USER_ID:-1000}
        GROUP_ID: ${DOCKER_GROUP_ID:-1000}
        DOCKER_USER: ${DOCKER_USER:-acore}
        SOURCE_PATH: source
    networks:
      - ac-network
    stdin_open: true
    tty: true
    ports:
      - "${DOCKER_WORLD_EXTERNAL_PORT:-8085}:8085"
      - "${DOCKER_SOAP_EXTERNAL_PORT:-7878}:7878"
      - "${DOCKER_RA_EXTERNAL_PORT:-3443}:3443"
    environment:
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};${AC_AUTH_DATABASE:-acore_auth}"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};${AC_WORLD_DATABASE:-acore_world}"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};${AC_CHARACTERS_DATABASE:-acore_characters}"
      AC_ASCENSION_COMPAT_DBC_DIRECTORY: "/azerothcore/env/dist/data/dbc/Ascension"
    volumes:
      - ${DOCKER_VOL_ETC:-./config}:/azerothcore/env/dist/etc
      - ${DOCKER_VOL_LOGS:-ac-server-logs}:/azerothcore/env/dist/logs
      - ${DOCKER_VOL_DATA:-./data}:/azerothcore/env/dist/data:ro
    restart: unless-stopped
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully
      ac-data-init:
        condition: service_completed_successfully

  ac-data-init:
    container_name: ac-data-init
    image: alpine:3.20
    restart: "no"
    networks:
      - ac-network
    volumes:
      - ${DOCKER_VOL_DATA:-./data}:/azerothcore/env/dist/data
    environment:
      DATA_URL: "https://github.com/d3athbl0w/CoA-Docker/releases/download/master/Data.zip"
      EXPECTED_SHA256: "92ba82ebc19ba820e004e8d4d4b89ee7c415d9e4124d92f29312f0e049c61079"
    command:
      - sh
      - -c
      - |
        set -eu
        TARGET_DIR="/azerothcore/env/dist/data"
        if [ -f "$$TARGET_DIR/dbc/AreaTable.dbc" ] && [ -f "$$TARGET_DIR/dbc/Ascension/Appearances.dbc" ]; then
          echo "[ac-data-init] Game data already present in $$TARGET_DIR. Skipping download."
          exit 0
        fi

        echo "[ac-data-init] Game data missing or incomplete in $$TARGET_DIR."
        echo "[ac-data-init] Installing download utilities..."
        apk add --no-cache curl unzip ca-certificates

        mkdir -p "$$TARGET_DIR" /tmp/coa-downloads
        ARCHIVE="/tmp/coa-downloads/Data.zip"

        echo "[ac-data-init] Downloading CoA Game Data (~466 MB) from $$DATA_URL..."
        curl -L -f --progress-bar -o "$$ARCHIVE" "$$DATA_URL"

        echo "[ac-data-init] Verifying SHA-256 checksum..."
        echo "$$EXPECTED_SHA256  $$ARCHIVE" | sha256sum -c -

        echo "[ac-data-init] Extracting game data into $$TARGET_DIR..."
        unzip -o -q "$$ARCHIVE" -d "$$TARGET_DIR"
        rm -rf /tmp/coa-downloads

        echo "[ac-data-init] Game data bootstrap completed successfully."


volumes:
  ac-database-data:
  ac-server-etc:
  ac-server-logs:

networks:
  ac-network:
    name: ac-network
    driver: bridge
